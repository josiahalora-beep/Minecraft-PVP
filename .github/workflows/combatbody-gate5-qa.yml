name: combatbody-gate5-scale

concurrency:
  group: combatbody-gate5-scale-${{ github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/NmsFakePlayerRuntime.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/CombatBodyScaleDirector.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/CombatBodyPvpDirector.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/SimWorldDirector.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/EraCore.java'
      - 'bots/src/combatbody-gate5-qa.js'
      - '.github/workflows/combatbody-gate5-qa.yml'

permissions:
  contents: read

jobs:
  gate5:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build EraCore
        working-directory: server/plugins-src/EraCore
        run: mvn -B package

      - name: Build Spigot 1.8.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gate5/buildtools
          cd .gate5/buildtools
          curl -fsSL https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8
          SPIGOT="$(find . -maxdepth 3 -type f -name 'spigot-1.8.8*.jar' | head -1)"
          test -n "$SPIGOT"
          cp "$SPIGOT" ../../server/spigot-1.8.8.jar

      - name: Install Mineflayer QA dependencies
        working-directory: bots
        run: npm install --no-audit --no-fund

      - name: Prepare disposable Gate 5 server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins/EraCore gate5-output
          cp server/plugins-src/EraCore/target/EraCore.jar server/plugins/EraCore.jar
          cp server/plugins-src/EraCore/src/main/resources/config.yml server/plugins/EraCore/config.yml
          printf 'eula=true\n' > server/eula.txt
          cat > server/server.properties <<'EOF'
          server-port=25565
          online-mode=false
          level-type=FLAT
          generate-structures=false
          spawn-protection=0
          view-distance=5
          EOF
          cd bots
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import YAML from 'yaml'
          const p='../server/plugins/EraCore/config.yml'
          const c=YAML.parse(fs.readFileSync(p,'utf8'))||{}
          c.map=c.map||{}
          c.map['auto-bootstrap']=false
          c.map.complete=true
          c.map['structures-complete']=true
          c['world-build']=c['world-build']||{}
          c['world-build'].active=false
          c['world-build']['terrain-complete']=true
          c['world-build']['resources-complete']=true
          c['world-build'].complete=true
          c['world-composer']=c['world-composer']||{}
          c['world-composer'].enabled=false
          c['base-builder']=c['base-builder']||{}
          c['base-builder']['lazy-materialization']=false
          c['ai-chat']=c['ai-chat']||{}
          c['ai-chat'].enabled=false
          c['sim-chat']=c['sim-chat']||{}
          c['sim-chat'].enabled=false
          c['spawn-presence']=c['spawn-presence']||{}
          c['spawn-presence'].enabled=false
          c['sim-world']=c['sim-world']||{}
          c['sim-world'].population=48
          c['sim-world']['logical-online-min']=48
          c['sim-world']['logical-online-peak']=48
          c['sim-world']['logical-online-late-night']=48
          c['sim-world']['tick-seconds']=10
          c.actors=c.actors||{}
          c.actors['fake-player']=c.actors['fake-player']||{}
          c.actors['fake-player']['allow-probe']=true
          c.actors['fake-player']['probe-max-bodies']=20
          c.actors['fake-player']['max-bodies']=20
          c.actors['fake-player'].enabled=true
          fs.writeFileSync(p,YAML.stringify(c))
          NODE

      - name: Start Spigot
        shell: bash
        run: |
          set -euo pipefail
          cd server
          nohup java -Xms768M -Xmx2G -jar spigot-1.8.8.jar nogui > gate5-server.log 2>&1 &
          echo $! > gate5-server.pid
          python3 - <<'PY'
          import socket,time
          end=time.time()+120
          while time.time()<end:
              s=socket.socket();s.settimeout(1)
              try:
                  s.connect(('127.0.0.1',25565))
                  print('Spigot Gate 5 server ready')
                  raise SystemExit(0)
              except OSError:
                  time.sleep(1)
              finally:
                  s.close()
          raise SystemExit('Spigot did not open 25565')
          PY

      - name: Run active CombatBody scale gate
        working-directory: bots
        run: node src/combatbody-gate5-qa.js | tee ../gate5-output/client.log

      - name: Verify Gate 5 evidence
        if: always()
        shell: bash
        run: |
          cp server/gate5-server.log gate5-output/server.log || true
          grep -E '\[CombatBody Gate5 stage\] bodies=12 .*avgMs=([0-4][0-9]|5[0-5])\.[0-9]+ .*p95Ms=([0-6][0-9]|70)\.[0-9]+ .*live=12 pass=true' server/gate5-server.log
          grep -E '\[CombatBody Gate5 command\] PASS required12=true highestPassing=(12|16) ' server/gate5-server.log
          if [ -f server/gate5-server.pid ]; then
            kill "$(cat server/gate5-server.pid)" || true
          fi

      - name: Upload Gate 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combatbody-gate5-scale-evidence
          path: gate5-output/
          if-no-files-found: error
          retention-days: 14
