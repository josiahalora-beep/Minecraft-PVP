name: phase1-terraincontrol-bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-terraincontrol-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate-defaults:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Spigot 1.8.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase1/buildtools
          cd .phase1/buildtools
          curl -fsSL \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar \
            -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8
          SPIGOT="$(find . -maxdepth 3 -type f -name 'spigot-1.8.8*.jar' | head -1)"
          test -n "$SPIGOT"
          cp "$SPIGOT" ../../server/spigot-1.8.8.jar

      - name: Install exact TerrainControl 2.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          curl -fL \
            https://github.com/MCTCP/TerrainControl/releases/download/v2.7.2/TerrainControl-Bukkit.jar \
            -o server/plugins/TerrainControl.jar
          sha256sum server/plugins/TerrainControl.jar | tee .phase1/terraincontrol.sha256

      - name: Prepare disposable generator boot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/world server/world_nether server/world_the_end server/plugins/TerrainControl
          printf 'eula=true\n' > server/eula.txt
          cat > server/server.properties <<'PROPS'
          server-port=25565
          server-ip=
          online-mode=false
          max-players=5
          motd=TerrainControl Phase 1 Bootstrap
          level-name=world
          level-seed=4920183751
          level-type=DEFAULT
          generator-settings=
          generate-structures=false
          spawn-protection=0
          pvp=true
          difficulty=2
          allow-flight=true
          allow-nether=false
          view-distance=4
          max-build-height=256
          spawn-animals=false
          spawn-monsters=false
          spawn-npcs=false
          PROPS
          cat > server/bukkit.yml <<'BUKKIT'
          settings:
            allow-end: false
            warn-on-overload: true
            spawn-radius: 0
          spawn-limits:
            monsters: 0
            animals: 0
            water-animals: 0
            ambient: 0
          ticks-per:
            animal-spawns: 400
            monster-spawns: 1
          worlds:
            world:
              generator: TerrainControl
          BUKKIT

      - name: Boot once and let TerrainControl write canonical 2.7.2 defaults
        shell: bash
        run: |
          set -euo pipefail
          cd server
          timeout 75s java -Xms512M -Xmx2G -jar spigot-1.8.8.jar nogui > ../.phase1/bootstrap.log 2>&1 || true
          test -f plugins/TerrainControl/worlds/world/WorldConfig.ini
          test -f "plugins/TerrainControl/worlds/world/WorldBiomes/PlainsBiomeConfig.ini"
          echo "TerrainControl generated canonical defaults."
          find plugins/TerrainControl/worlds/world -maxdepth 2 -type f -print | sort

      - name: Upload canonical TerrainControl defaults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraincontrol-2.7.2-defaults
          path: |
            server/plugins/TerrainControl/worlds/world/
            .phase1/terraincontrol.sha256
            .phase1/bootstrap.log
          if-no-files-found: warn
          retention-days: 14
