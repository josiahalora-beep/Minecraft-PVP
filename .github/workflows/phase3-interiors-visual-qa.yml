name: phase3-interiors-visual-qa

concurrency:
  group: phase3-interiors-visual-qa
  cancel-in-progress: true

# Manual runs remain available, and corrective visual-QA changes also trigger
# this workflow so renderer-only findings can be checked against a real client.
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/HcfBaseBuilder.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/HcfSurfaceReferenceTemplates.java'
      - 'bots/src/qa-inspector.js'
      - '.github/workflows/phase3-interiors-visual-qa.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build EraCore
        working-directory: server/plugins-src/EraCore
        run: mvn -B package

      - name: Build Spigot 1.8.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase1/buildtools
          cd .phase1/buildtools
          curl -fsSL \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar \
            -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8
          SPIGOT="$(find . -maxdepth 3 -type f -name 'spigot-1.8.8*.jar' | head -1)"
          test -n "$SPIGOT"
          cp "$SPIGOT" ../../server/spigot-1.8.8.jar

      - name: Download verified public Stylez HCF map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase1/map
          python3 - <<'PY'
          import hashlib,html,json,re,urllib.parse,urllib.request,urllib.error
          key='32sslt4lmrut2e0'
          expected='af9c214979fcde0b1c41e435a6359940a930ffa97c8e2ad09667f74203afba95'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          headers={
              'User-Agent':ua,
              'Accept':'application/json,text/html,*/*',
              'Referer':'https://builtbybit.com/'
          }

          api=f'https://www.mediafire.com/api/1.5/file/get_info.php?quick_key={key}&response_format=json'
          req=urllib.request.Request(api,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              info=json.loads(r.read().decode('utf-8'))['response']['file_info']

          if info.get('privacy')!='public' or info.get('ready')!='yes':
              raise SystemExit('MediaFire file is no longer public/ready')
          if info.get('hash','').lower()!=expected:
              raise SystemExit('MediaFire API hash changed: '+str(info.get('hash')))
          if info.get('filename')!='FreeMap.rar':
              raise SystemExit('Unexpected MediaFire filename: '+str(info.get('filename')))

          normal=info.get('links',{}).get('normal_download')
          if not normal:
              raise SystemExit('MediaFire API did not return normal_download')
          req=urllib.request.Request(normal,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              page=r.read().decode('utf-8','replace')

          direct=None
          for pat in [
              r'id=["\']downloadButton["\'][^>]+href=["\']([^"\']+)',
              r'href=["\']([^"\']+)["\'][^>]+id=["\']downloadButton["\']',
              r'aria-label=["\']Download file["\'][^>]+href=["\']([^"\']+)',
              r'href=["\'](https?://download[^"\']+)["\']'
          ]:
              m=re.search(pat,page,re.I)
              if m:
                  direct=html.unescape(m.group(1))
                  break
          if not direct:
              raise SystemExit('Canonical MediaFire page did not expose a CDN download URL')

          host=urllib.parse.urlparse(direct).netloc
          if not (host.endswith('.mediafire.com') and host.startswith('download')):
              raise SystemExit('Refusing unexpected download host: '+host)
          print('Downloading verified public asset from',host)

          req=urllib.request.Request(direct,headers={**headers,'Referer':normal})
          h=hashlib.sha256()
          size=0
          with urllib.request.urlopen(req,timeout=180) as r, open('.phase1/map/FreeMap.rar','wb') as out:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  out.write(b); h.update(b); size+=len(b)
          actual=h.hexdigest()
          print('Downloaded bytes=',size,'sha256=',actual)
          if actual!=expected:
              raise SystemExit('Downloaded authored map checksum mismatch: '+actual)
          if size!=int(info.get('size','0')):
              raise SystemExit('Downloaded authored map size mismatch')
          PY

      - name: Extract authored map
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z x -y .phase1/map/FreeMap.rar -o.phase1/map/extracted >/dev/null
          test -f .phase1/map/extracted/FreeWorld/level.dat
          test -d .phase1/map/extracted/FreeWorld/region
          rm -rf server/world
          cp -a .phase1/map/extracted/FreeWorld server/world
          rm -f server/world/session.lock

      - name: Restore verified production schematic assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase1/assets server/map-assets
          cat .github/qa-assets/production-assets.part*.b64 | base64 -d > .phase1/assets/production-assets.zip
          echo "121b6707754764ffc88d1ea18a6f009c440f2d81a5e13cd68ef411461cd49eec  .phase1/assets/production-assets.zip" | sha256sum -c -
          unzip -q -o .phase1/assets/production-assets.zip -d server/map-assets

          cd server/map-assets
          printf '%s  %s\n' \
            '3f41d2ac7d329f96c0d33c8ec2ba3807d74f35d4b01b0b544644a585d7d2e378' 'HCF-Spawn-101-production.schematic' \
            '76927168a1f228f7c12c4a00c48f5785fd25b02b4d66f26bb496e540cdc82a31' 'KOTH2-production-1.8.schematic' \
            'ebe27dfc5c102fe84c9f1c748fc52850486c22edc0835ba3ee1a355d7a759182' 'EndStyleKOTH-production-1.8.schematic' \
            '99fed90e7a57bb6c16cf9293b11f4cf9236a2f6bc3e0acdd8c1facba306d351d' 'EgyptKOTH-production-1.8.schematic' \
            '1893f941747cd9f8a1e92f4df42e68341fa934a14c2e875c68fd09377655c4de' 'KOTH-Forty-1.8-converted.schematic' \
            'cd6bf439e9bd18858dcb144d5e96f9749e2e2b935a51c89bc860026285d2f336' 'conquest.schematic' \
            '8db0cf006c9ef9d4b1f8c297b4e5a0747552b629fefdb0e0d95280ec100706d9' 'NetherSpawnWillzaTeam.schematic' \
            '952bf326168522641192c66fea5100d637821e1e1f19c77ce8035b7fd4be2754' 'magical-hcf-end-xayden-bt.schematic' \
            | sha256sum -c -

      - name: Install headless renderer
        working-directory: bots
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund prismarine-viewer canvas github:PrismarineJS/node-canvas-webgl
          node --check src/qa-inspector.js
          xvfb-run -a -s "-screen 0 1600x900x24" node --input-type=module -e "const {createCanvas}=await import('node-canvas-webgl/lib/index.js'); const c=createCanvas(64,64); const gl=c.getContext('webgl'); if(!gl) throw new Error('headless WebGL context unavailable')"

      - name: Prepare production-faithful visual QA server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins/EraCore qa-output
          cp server/plugins-src/EraCore/target/EraCore.jar server/plugins/EraCore.jar
          cp server/plugins-src/EraCore/src/main/resources/config.yml server/plugins/EraCore/config.yml
          printf 'eula=true\n' > server/eula.txt
          cat >> server/server.properties <<'EOF'
          enable-rcon=true
          rcon.password=eracore-qa
          rcon.port=25575
          EOF

          cd bots
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import YAML from 'yaml'
          const p='../server/plugins/EraCore/config.yml'
          const c=YAML.parse(fs.readFileSync(p,'utf8'))||{}
          c.map=c.map||{}
          c.map['auto-bootstrap']=false
          c.map.complete=true
          c.map['structures-complete']=true
          c.map['manage-world-border']=true
          c.map['world-border']=2000

          c['world-build']=c['world-build']||{}
          c['world-build'].active=false
          c['world-build']['terrain-complete']=true
          c['world-build']['resources-complete']=true
          c['world-build'].complete=true

          c.terrain=c.terrain||{}
          c.terrain['authored-world']=true
          c.terrain['normalize-new-chunks']=false
          c.terrain['custom-decoration']=false

          c['world-composer']=c['world-composer']||{}
          c['world-composer'].enabled=false
          c['ai-chat']=c['ai-chat']||{}
          c['ai-chat'].enabled=false
          c['sim-chat']=c['sim-chat']||{}
          c['sim-chat'].enabled=false
          c['sim-world']=c['sim-world']||{}
          c['sim-world'].population=0

          c['base-builder']=c['base-builder']||{}
          c['base-builder']['qa-showcase']=true
          c['base-builder']['qa-fast-rebuild']=true
          c['base-builder']['qa-fast-rebuild-blocks-per-run']=3000
          c['base-builder']['qa-showcase-storage-tier']=3
          c['base-builder']['qa-showcase-brewer']=true
          c['base-builder']['qa-showcase-nether-portal']=true
          c['base-builder']['qa-showcase-end-portal']=false

          fs.writeFileSync(p,YAML.stringify(c))
          NODE

      - name: Start authored HCF map
        shell: bash
        run: |
          set -euo pipefail
          cd server
          nohup java -Xms1G -Xmx4G -jar spigot-1.8.8.jar nogui > phase1-server.log 2>&1 &
          echo $! > phase1-server.pid
          python3 - <<'PY'
          import socket,time,sys
          end=time.time()+180
          while time.time()<end:
              s=socket.socket(); s.settimeout(1)
              try:
                  s.connect(('127.0.0.1',25565))
                  print('Spigot authored-world port ready')
                  sys.exit(0)
              except OSError:
                  time.sleep(1)
              finally:
                  s.close()
          print(open('phase1-server.log','r',errors='ignore').read()[-12000:])
          raise SystemExit('Spigot did not open 25565')
          PY

      - name: Capture five-family HCF interiors
        working-directory: bots
        env:
          QA_OUTPUT_DIR: ${{ github.workspace }}/qa-output
          SIMULATION_FILE: ${{ github.workspace }}/server/plugins/EraCore/simulation.yml
          ERACORE_CONFIG: ${{ github.workspace }}/server/plugins/EraCore/config.yml
          QA_TERRAIN_ONLY: '0'
          QA_BASES_ONLY: '1'
          QA_SHOWCASE: '1'
          QA_INTERIORS_ONLY: '1'
          QA_REBUILD_TIMEOUT_MS: '300000'
          QA_DETAIL_PASS: '0'
          QA_TEST_ATMOSPHERE: '0'
          QA_VIEW_DISTANCE: '12'
          QA_WIDTH: '1600'
          QA_HEIGHT: '900'
        run: timeout 12m xvfb-run -a -s "-screen 0 1600x900x24" node src/qa-inspector.js

      - name: Verify Base-HCF interiors in official vanilla 1.8.8 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot x11-xserver-utils libgl1-mesa-dri libglx-mesa0 libglu1-mesa libxrandr2 libxcursor1 libxinerama1 libxi6 libxxf86vm1 libasound2
          python3 -m pip install --quiet minecraft-launcher-lib mcrcon

          mkdir -p qa-output/diagnostics
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1600x900x24 > qa-output/diagnostics/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$XVFB_PID"

          python3 - <<'PY'
          import math, os, pathlib, re, shutil, subprocess, time
          import minecraft_launcher_lib
          from mcrcon import MCRcon

          root=pathlib.Path.cwd()
          out=root/'qa-output'
          diag=out/'diagnostics'
          diag.mkdir(parents=True,exist_ok=True)
          log=(root/'server'/'phase1-server.log').read_text(errors='ignore')

          m=None
          for hit in re.finditer(r'\[qa-showcase\] queued QABase0 family=BASE_HCF .*? at=(-?\d+),(-?\d+),(-?\d+) undergroundY=(-?\d+) coreHalf=(\d+),(\d+)',log):
              m=hit
          if not m:
              raise SystemExit('Could not resolve QABase0 coordinates for vanilla-client proof')

          x,y,z,u,hx,hz=map(int,m.groups())
          mc_dir=root/'.phase3'/'vanilla-client'
          mc_dir.mkdir(parents=True,exist_ok=True)
          version='1.8.8'
          minecraft_launcher_lib.install.install_minecraft_version(version,str(mc_dir))

          java=shutil.which('java')
          if not java:
              raise SystemExit('Java executable not found')
          opts={
              'username':'VisualQA',
              'uuid':'00000000000000000000000000000001',
              'token':'0',
              'launcherName':'EraCoreQA',
              'launcherVersion':'1.0',
              'gameDirectory':str(mc_dir),
              'executablePath':java,
              'jvmArguments':['-Xms512M','-Xmx1400M','-Djava.awt.headless=false']
          }
          cmd=minecraft_launcher_lib.command.get_minecraft_command(version,str(mc_dir),opts)
          cmd += ['--server','127.0.0.1','--port','25565','--width','1600','--height','900']
          client_log=open(diag/'vanilla-client.log','wb')
          env=os.environ.copy()
          env['DISPLAY']=':99'
          env['LIBGL_ALWAYS_SOFTWARE']='1'
          proc=subprocess.Popen(cmd,stdout=client_log,stderr=subprocess.STDOUT,cwd=str(mc_dir),env=env)

          try:
              end=time.time()+150
              connected=False
              while time.time()<end:
                  if proc.poll() is not None:
                      raise SystemExit('Vanilla 1.8.8 client exited before joining; see vanilla-client.log')
                  try:
                      with MCRcon('127.0.0.1','eracore-qa',port=25575) as r:
                          if 'VisualQA' in r.command('list'):
                              connected=True
                              break
                  except Exception:
                      pass
                  time.sleep(2)
              if not connected:
                  raise SystemExit('Vanilla 1.8.8 client did not join QA server')

              def look(from_xyz,to_xyz):
                  fx,fy,fz=from_xyz
                  tx,ty,tz=to_xyz
                  dx,dy,dz=tx-fx,ty-fy,tz-fz
                  yaw=math.degrees(math.atan2(-dx,dz))
                  pitch=-math.degrees(math.atan2(dy,max(0.001,math.hypot(dx,dz))))
                  return yaw,pitch

              def capture(name,pos,target):
                  yaw,pitch=look(pos,target)
                  with MCRcon('127.0.0.1','eracore-qa',port=25575) as r:
                      r.command('gamemode 3 VisualQA')
                      r.command('tp VisualQA %.2f %.2f %.2f %.2f %.2f' % (*pos,yaw,pitch))
                  time.sleep(6)
                  shot=out/name
                  subprocess.run(['scrot','-o',str(shot)],check=True,env=env)
                  if not shot.exists() or shot.stat().st_size<20000:
                      raise SystemExit('Vanilla screenshot missing/too small: '+str(shot))

              capture('vanilla-base-hcf-interior-core.png',
                      (x,u+2,z+8),(x,u+2,z))
              capture('vanilla-base-hcf-interior-storage-west.png',
                      (x+2,u+3,z-6),(x-hx+5,u+3,z-4))
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try: proc.wait(timeout=8)
                  except subprocess.TimeoutExpired: proc.kill()
              client_log.close()
          PY

      - name: Verify Phase 3 interior coverage
        if: always()
        shell: bash
        run: |
          mkdir -p qa-output/diagnostics
          cp server/phase1-server.log qa-output/diagnostics/server.log || true
          cp server/plugins/EraCore/config.yml qa-output/diagnostics/config.yml || true
          cp server/world/level.dat qa-output/diagnostics/level.dat || true
          grep -q "overworld=2000" server/phase1-server.log
          grep -q "\[qa-showcase\] build queue drained" server/phase1-server.log
          for family in REDEMPTION BASE_HCF MODERN_HCF TUNNEL CAVE; do
            grep -q "family=$family" server/phase1-server.log
          done
          test "$(find qa-output -maxdepth 1 -name '*interior-core-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-elevator-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-circulation-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-stairs-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-dropdown-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-refill-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-storage-west-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-storage-east-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-utility-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-farm-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-brewer-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-nether-portal-first.jpg' | wc -l)" -eq 5
          test "$(find qa-output -maxdepth 1 -name '*interior-enchant-first.jpg' | wc -l)" -eq 5
          test -s qa-output/vanilla-base-hcf-interior-core.png
          test -s qa-output/vanilla-base-hcf-interior-storage-west.png
          if grep -q "production terrain repair chunks=" server/phase1-server.log; then
            echo "ERROR: old wilderness normalizer ran on authored world" >&2
            exit 1
          fi
          if [ -f server/phase1-server.pid ]; then
            kill "$(cat server/phase1-server.pid)" || true
          fi

      - name: Upload Phase 3 interior screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-interiors-visual-qa
          path: qa-output/
          if-no-files-found: error
          retention-days: 14
