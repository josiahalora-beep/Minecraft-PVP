name: visual-qa-hcf-bases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-qa-hcf-bases.yml'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/HcfBaseBuilder.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/HcfBasePlan.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/HcfTerrainDirector.java'
      - 'server/plugins-src/EraCore/src/main/java/dev/jorel/eracore/SimWorldDirector.java'
      - 'bots/src/qa-inspector.js'

concurrency:
  group: visual-qa-hcf-bases
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build EraCore
        working-directory: server/plugins-src/EraCore
        run: mvn -B package

      - name: Build Spigot 1.8.8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-build/buildtools
          cd .qa-build/buildtools
          curl -fsSL \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar \
            -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8
          SPIGOT="$(find . -maxdepth 3 -type f -name 'spigot-1.8.8*.jar' | head -1)"
          test -n "$SPIGOT"
          cp "$SPIGOT" ../../server/spigot-1.8.8.jar

      - name: Install headless renderer
        working-directory: bots
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund prismarine-viewer canvas github:PrismarineJS/node-canvas-webgl
          node --check src/qa-inspector.js
          xvfb-run -a -s "-screen 0 1280x720x24" node --input-type=module -e "const {createCanvas}=await import('node-canvas-webgl/lib/index.js'); const c=createCanvas(64,64); const gl=c.getContext('webgl'); if(!gl) throw new Error('headless WebGL context unavailable'); console.log('headless visual QA ready:',gl.getParameter(gl.VERSION))"

      - name: Prepare isolated terrain and base QA server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins/EraCore qa-output
          cp server/plugins-src/EraCore/target/EraCore.jar server/plugins/EraCore.jar
          cp server/plugins-src/EraCore/src/main/resources/config.yml server/plugins/EraCore/config.yml
          printf 'eula=true\n' > server/eula.txt

          cd bots
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import YAML from 'yaml'
          const path='../server/plugins/EraCore/config.yml'
          const c=YAML.parse(fs.readFileSync(path,'utf8'))||{}

          c.map=c.map||{}
          c.map['auto-bootstrap']=true
          c.map.complete=false
          c.map['structures-complete']=true
          c.map['manage-world-border']=false

          c['world-build']=c['world-build']||{}
          c['world-build']['auto-resume']=true
          c['world-build'].active=true
          c['world-build']['terrain-complete']=false
          c['world-build']['resources-complete']=true
          c['world-build'].complete=false
          c['world-build']['max-p95-mspt']=45

          c['world-composer']=c['world-composer']||{}
          c['world-composer'].enabled=false

          c.spawn=c.spawn||{}
          c.spawn['external-schematic']=false

          c.infrastructure=c.infrastructure||{}
          c.infrastructure['external-dimension-schematics']=false

          c['sim-world']=c['sim-world']||{}
          c['sim-world'].population=150
          c['sim-world']['tick-seconds']=10
          c['sim-world']['factions-per-tick']=12

          c['base-builder']=c['base-builder']||{}
          c['base-builder']['qa-fast-rebuild']=true
          c['base-builder']['qa-showcase']=true
          c['base-builder']['qa-fast-rebuild-blocks-per-run']=6000
          c['base-builder']['blocks-per-tick']=1200
          c['base-builder']['visible-blocks-per-tick']=1200
          c['base-builder']['rebuild-blocks-per-tick']=1800
          c['base-builder']['interval-ticks']=1
          c['base-builder']['lazy-check-ticks']=60
          c['base-builder']['lazy-max-p95-mspt']=45

          c['ai-chat']=c['ai-chat']||{}
          c['ai-chat'].enabled=false
          c['sim-chat']=c['sim-chat']||{}
          c['sim-chat'].enabled=false

          fs.writeFileSync(path,YAML.stringify(c))
          NODE

      - name: Start isolated Spigot server
        shell: bash
        run: |
          set -euo pipefail
          cd server
          nohup java -Xms1G -Xmx4G -jar spigot-1.8.8.jar nogui > qa-server.log 2>&1 &
          echo $! > qa-server.pid

          python3 - <<'PY'
          import socket,time,sys
          end=time.time()+180
          while time.time()<end:
              s=socket.socket()
              s.settimeout(1)
              try:
                  s.connect(('127.0.0.1',25565))
                  print('Spigot port is ready')
                  sys.exit(0)
              except OSError:
                  time.sleep(1)
              finally:
                  s.close()
          print(open('qa-server.log','r',errors='ignore').read()[-12000:])
          raise SystemExit('Spigot did not open 25565')
          PY

      - name: Render five-family terrain integration QA
        working-directory: bots
        env:
          QA_OUTPUT_DIR: ${{ github.workspace }}/qa-output
          SIMULATION_FILE: ${{ github.workspace }}/server/plugins/EraCore/simulation.yml
          ERACORE_CONFIG: ${{ github.workspace }}/server/plugins/EraCore/config.yml
          QA_BASES_ONLY: '1'
          QA_SHOWCASE: '1'
          QA_REBUILD_BASES: '1'
          QA_TEST_ATMOSPHERE: '1'
          QA_VIEW_DISTANCE: '10'
          QA_WIDTH: '1280'
          QA_HEIGHT: '720'
          QA_REBUILD_TIMEOUT_MS: '180000'
        run: timeout 28m xvfb-run -a -s "-screen 0 1280x720x24" node src/qa-inspector.js

      - name: Preserve server diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p qa-output/diagnostics
          cp server/qa-server.log qa-output/diagnostics/server.log || true
          cp server/plugins/EraCore/simulation.yml qa-output/diagnostics/simulation.yml || true
          cp server/plugins/EraCore/config.yml qa-output/diagnostics/config.yml || true
          if [ -f server/qa-server.pid ]; then
            kill "$(cat server/qa-server.pid)" || true
          fi

      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcf-base-visual-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
