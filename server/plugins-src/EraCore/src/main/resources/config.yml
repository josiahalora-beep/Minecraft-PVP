  sotw-scrim-chance-percent: 72

worker-pool:
  # Global HOT-body ceiling across every registered machine. The coordinator
  # subdivides this budget into per-node leases.
  max-bodies: 40
  offline-bodies: 24
  node-default-bodies: 12
  max-per-faction: 5
  reassess-seconds: 8
  sync-seconds: 10
  minimum-lease-seconds: 120
  missing-candidate-grace-cycles: 4
  rotation-score-margin: 18
  fight-ambient-bodies: 2
  creator-bodies:
    - Stimpypvp
    - Marcel
    - PainfulPvP
    - lolitsalex
    - Skimpy

safezones:
