  # warps and protection but must not overwrite the schematic with its old hub.
  external-schematic: true
  preset: kraken
  road-exit-distance: 122

spawn-build-protection:
  radius: 82
  corner-pad: 10

travel:
  # /spawn and /warp are HCF escape-sensitive commands, never instant.
  warmup-seconds: 10

stuck:
  cooldown-seconds: 60
