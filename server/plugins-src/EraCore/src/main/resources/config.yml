owner:
  claim-first-human: true
  uuid: ''
  name: ''
  ignored-prefixes:
    - Bench
    - DuelBot
    - StateBot
    - Sim
    - Fake
map:
  auto-bootstrap: false
  complete: false
  structures-complete: false
  surface-y: 63
  world-border: 3000
  warzone-smoothing-radius: 520
  warzone-smoothing-version: 0
  nether-border: 1000
  manage-world-border: true
  safezone-radius: 110
  warzone-radius: 300
economy:
  starting-balance: 500.0
  cycle-director-ticks: 10
kits:
  starter-cooldown-hours: 6

rewards:
  enabled: true
  vote-cooldown-hours: 12
  basic-key-hours: 24
  silver-key-hours: 18
  gold-key-hours: 12
  platinum-key-hours: 8
  vote-party-target: 20
  # Exact historical Kohi vote/donor crate odds are not reliably documented.
  # These tables are intentionally explicit and early-map balanced.
  vote-odds:
    money-300: 16.0
    pearls-12: 15.0
    obsidian-16: 12.0
    diamonds-8: 10.0
    heals-10: 12.0
    wart-16: 8.0
    glowstone-12: 8.0
    gunpowder-16: 8.0
    sharp1-diamond: 6.5
    basic-donor-key: 2.4
    p2-piece: 1.2
    sharp2-fire1: 0.7
    full-p2-set-sharp2-fire1: 0.2
  # Donor odds vary by key tier. Premium ranges below are per-key:
  # Basic 2.00% P2 piece / 0.80% S2F1 / 0.15% full set
  # Silver 3.00% / 1.20% / 0.25%
  # Gold 4.50% / 1.80% / 0.40%
  # Platinum 6.00% / 2.50% / 0.70%
  donor-odds:
    common-progression: tier-scaled
    p2-piece: 2.0-6.0
    sharp2-fire1: 0.8-2.5
    full-p2-set-sharp2-fire1: 0.15-0.70
  koth-odds:
    pearls: 13.0
    heals: 13.0
    glowstone: 12.0
    gunpowder: 12.0
    obsidian: 10.0
    diamonds: 8.0
    looting4-event-sword: 6.0
    fortune4-event-pick: 5.0
    p2-diamond-piece: 14.0
    sharp2-fire1-event-sword: 5.5
    full-p2-koth-set-sharp2-fire1: 1.5

pvp:
  pearl-cooldown-seconds: 16
metrics:
  enabled: true
  interval-seconds: 5

creator-tag:
  enabled: true
  minimum-donor-level: 0
  head-prefix: '&c[YT] &f'
  chat-prefix: '&c[YT] &r'
  # Marcel / Stimp / Stimpypvp are aliases of the same creator identity.
  # Only one simulated player is seeded so the same person never appears twice.
  creators:
    - Stimpy
    - PainfulPvP
    - lolitsalex
    - Skimpy

ai-chat:
  enabled: true
  endpoint: 'http://127.0.0.1:8765/reply'
  timeout-ms: 6500

sim-chat:
  recent-line-window: 80
  per-speaker-recent-window: 12
  semantic-repeat-window-seconds: 1200
  ai-direct-human-only: true
  ai-min-seconds-between-requests: 8
  ai-max-requests-per-minute: 4
  enabled: true
  contextual-chat: true
  max-conversation-memory: 12
  second-responder-chance-percent: 15
  min-delay-seconds: 3
  max-delay-seconds: 7
  quiet-min-delay-seconds: 10
  quiet-max-delay-seconds: 24
  identity-cooldown-seconds: 18
  line-cooldown-seconds: 55
  fan-reaction-cooldown-seconds: 180
  max-fan-reactions: 1
  roster:
    - Vexon
    - Mints
    - Zyro
    - Riven
    - Axion
    - Finesse
    - Deceive
    - Jettison
    - Shanked
    - Reborn
    - Ghosted
    - Beamed
    - PurpleDino
    - xRico
    - xSavage
    - iTzMason
    - FrostyHD
    - ClutchKid
    - Stimpy
    - PainfulPvP
    - lolitsalex
    - Skimpy
  fans:
    - xRico
    - PurpleDino
    - ClutchKid
    - Waffle
    - Grape
    - Nightfall
  lines:
    - 'anyone selling p2'
    - 'who has pearls'
    - 'buying obsidian'
    - 'selling pots msg me'
    - 'any factions recruiting'
    - 'who wants to pvp'
    - 'gg'
    - 'lol'
    - 'need 1 more'
    - 'anyone at blaze'
    - 'paying 8k for silk'
    - 'who raided us'
    - 'tp for 1v1'
    - 'need pots'
    - 'anyone mining'
    - 'who wants ally'
    - 'nice base lol'
    - 'who just died at spawn'
    - 'selling 2 dubs of cane'
    - 'buying tnt'
    - 'inv me'
    - 'bruh'
    - 'that combo'
    - 'meet at spawn'
    - 'selling pearls cheap'
    - 'need one for our faction'
    - 'who is rich rn'

logical-tab:
  packet-batch-size: 20
  visible-identities: 100
  refresh-seconds: 10

sim-world:
  population: 150
  tick-seconds: 30
  factions-per-tick: 4
  underdog-leaders: 2
  base-y: 64
  min-base-y: 50
  max-base-y: 110
  max-base-site-relief: 4
  max-base-site-liquid-samples: 1
  logical-online-min: 88
  logical-online-peak: 132
  logical-online-late-night: 52
  session-min-minutes: 25
  session-max-minutes: 140

spawn-presence:
  enabled: false
  real-players-only: true
  count: 4
  update-ticks: 20
  names:
    - xRico
    - PurpleDino
    - BreezyMC
    - MasonHD
    - NightPvP
    - Vexing

hcf-classes:
  permanent-speed-2: true
  enabled: true
  bard-radius: 30.0
  bard-click-seconds: 5
  archer-bonus-per-block: 0.08
  archer-max-bonus-damage: 4.0
  miner-invisibility-y: 20
  rogue-backstab-cooldown-seconds: 20
  rogue-backstab-bonus-damage: 7.0

dtr:
  max-per-member: 1.1
  max-cap: 5.5
  loss-per-death: 1.0
  raidable-at: 0.0
  freeze-seconds-after-death: 120
  regen-interval-seconds: 60
  regen-per-interval: 0.35

claims:
  # Legacy chunk limits are retained only for old-save migration.
  base: 4
  per-member: 2
  max-cap: 12
  min-width: 12
  max-width: 110
  sim-base-buffer-blocks: 8

sotw:
  # Short bootstrap protection only. PvP should become part of the server loop
  # early rather than factions spending an hour in an isolated economy phase.
  protection-minutes: 12

terrain:
  normalize-new-chunks: true
  cleanup-height: 46
  road-flat-half-width: 20.0
  road-shoulder-half-width: 72.0
  custom-decoration: true

base-builder:
  blocks-per-tick: 96
  visible-blocks-per-tick: 16
  rebuild-blocks-per-tick: 40
  interval-ticks: 2
  gate-auto-close-ticks: 30
  repair-existing-on-start: false
  lazy-materialization: true
  lazy-check-ticks: 100
  lazy-radius: 144
  lazy-max-p95-mspt: 18.0

combat-director:
  hot-body-budget: 12
  visible-fight-min-seconds: 10
  visible-fight-max-seconds: 22
  visible-fight-duration-seconds: 110
  visible-fight-chance-percent: 94
  # This is third-party PRESENCE, not automatic combat. Most third factions
  # watch, shadow, wait for a cleanup, or pass without entering the fight.
  three-way-brawl-chance-percent: 12
  third-party-decision-seconds: 3
  third-party-cleanup-health: 8.0
  third-party-shadow-health: 5.0
  max-hot-per-faction: 5
  observation-radius: 220
  offscreen-resolution-seconds: 5
  offscreen-brawl-chance-percent: 18
  brawl-radius: 520
  hotspot-funnel-percent: 76
  sotw-scrim-min-seconds: 18
  sotw-scrim-max-seconds: 34
  sotw-scrim-duration-seconds: 75
  sotw-scrim-chance-percent: 72

worker-pool:
  # Global HOT-body ceiling across every registered machine. The coordinator
  # subdivides this budget into per-node leases.
  max-bodies: 40
  offline-bodies: 24
  node-default-bodies: 12
  max-per-faction: 5
  reassess-seconds: 8
  sync-seconds: 10
  minimum-lease-seconds: 120
  missing-candidate-grace-cycles: 4
  rotation-score-margin: 18
  fight-ambient-bodies: 2
  # Reserved physical identities: faction leaders/builders/creators first,
  # followed by the most prestigious/respected players.
  anchor-bodies: 20
  prestige-bodies: 10
  creator-bodies:
    - Stimpy
    - PainfulPvP
    - lolitsalex
    - Skimpy

safezones:
  combat-tag-seconds: 60
  overworld-radius: 110
  nether-radius: 75
  end-radius: 95
  auto-build-borders: false
  archer-tag-seconds: 10
  archer-tag-damage-multiplier: 1.20

duels:
  center-x: 200
  center-z: 0
  timeout-seconds: 180
  random-challenges: true

infrastructure:
  duel-world: duel_arena
  duel-world-border: 192
  external-dimension-schematics: true
  blocks-per-tick: 150
  duel-center-x: 0
  duel-center-z: 0
  duel-floor-y: 64
  nether-y: 70
  end-y: 68

spawn:
  # External Kraken 150x150 build is authoritative. EraCore supplies mechanics,
  # warps and protection but must not overwrite the schematic with its old hub.
  external-schematic: true
  preset: kraken
  road-exit-distance: 122
  # Functional blocks are placed into existing Kraken floor space only.
  # No crate court, beacon, signs or generated spawn geometry.
  crates:
    y: 67
    z: 36
    vote-x: -8
    donor-x: 0
    koth-x: 8

spawn-build-protection:
  radius: 190
  corner-pad: 10

travel:
  faction-home-warmup-seconds: 10
  faction-stuck-warmup-seconds: 180
  # Owner diagnostics use the generic warmup; normal HCF players use the
  # faction-home and faction-stuck timings below.
  warmup-seconds: 10

stuck:
  cooldown-seconds: 60

# Canonical 3k HCF production layout. Safezones and build/claim protection are
# separate: KOTHs/resources stay PvP-active while remaining unbuildable.
map-layout:
  koth-offset: 500
  koth-radius: 165
  portal-offset: 1000
  portal-radius: 125
  conquest-x: 0
  conquest-z: 1125
  conquest-radius: 175
  spawn-build-radius: 190
  spawn-claim-radius: 500
  nether-build-radius: 120
  end-build-radius: 145
  ore-world: ore_mountain
  build-visible-borders: false
  show-claim-border: true

events:
  auto-schedule:
    enabled: true
    minimum-logical-online: 20
    min-gap-minutes: 35
    max-gap-minutes: 70
    warning-minutes: 5
    max-active-minutes: 25
  koth-capture-seconds: 180
  koth-capture-radius: 8.0
  koth-announce-every-seconds: 30
  conquest-point-capture-seconds: 15
  conquest-point-radius: 7.0
  conquest-score-to-win: 300

resources:
  # Construction is staged by HcfWorldBuildDirector; this legacy flag stays off.
  bootstrap-spawners: false
  blocks-per-tick: 110
  mob-stack-merge-radius: 10.0
  glowstone:
    x: 0
    z: -320
    radius: 105
    regen-min-seconds: 45
    regen-max-seconds: 90
  blaze:
    x: 300
    y: 70
    z: 190
    radius: 90
    stack-cap: 20
  wart:
    x: -285
    z: 205
    radius: 90
    regen-min-seconds: 45
    regen-max-seconds: 90
  nether-koth:
    x: -300
    z: -220
    radius: 125
  end-koth:
    x: -300
    z: -120
    radius: 125
  creeper:
    x: 160
    y: 69
    z: 235
    radius: 60
    stack-cap: 25
  end-exit:
    x: 330
    z: 0
    safe-radius: 34
  ore-mountain:
    enabled: true
    base-y: 63
    world-border: 320
    coal-regen-min-seconds: 18
    coal-regen-max-seconds: 35
    iron-regen-min-seconds: 28
    iron-regen-max-seconds: 50
    redstone-regen-min-seconds: 35
    redstone-regen-max-seconds: 60
    gold-regen-min-seconds: 45
    gold-regen-max-seconds: 75
    diamond-regen-min-seconds: 70
    diamond-regen-max-seconds: 120
    emerald-regen-min-seconds: 90
    emerald-regen-max-seconds: 150

world-build:
  auto-resume: true
  active: false
  terrain-complete: false
  complete: false
  resources-complete: false
  max-p95-mspt: 32.0
  # Optional SSD archive root. Empty keeps world archives under server/world-archives.
  archive-directory: ""

world-composer:
  enabled: true
  blocks-per-tick: 320
  spawn-anchor-y: 66
  conquest-anchor-y: 63
  nether-anchor-y: 70
  end-anchor-y: 68
  assets:
    spawn: krakenhcf.schematic
    koth-classic: KOTH2-production-1.8.schematic
    koth-endstyle: EndStyleKOTH-production-1.8.schematic
    koth-egypt: EgyptKOTH-production-1.8.schematic
    koth-frost: KOTH-Forty-1.8-converted.schematic
    conquest: conquest.schematic
    nether-spawn: NetherSpawnWillzaTeam.schematic
    end: magical-hcf-end-xayden-bt.schematic

# Experimental three-runtime actor layer. Production materialization stays off
# until the one-body damage/death/DTR probe passes on the exact v1_8_R3 server.
actors:
  fake-player:
    enabled: false
    allow-probe: true
    materialize-on-tp: false
    max-bodies: 8
    default-ping: 55

# Deterministic bounded memory; no recurring LLM summarization.
memory:
  # Hot memory stays bounded and instantly searchable for chat/decisions.
  relationship-max: 64
  history-max-events: 10000
  archive-max-bytes: 134217728
  duplicate-window-seconds: 1800
  # Optional absolute path on the spare SSD. Empty = plugins/EraCore/memory-archive.
  cold-archive-directory: ""
  cold-shard-max-bytes: 268435456
  cold-max-shards: 48
  # Chat retrieves a small relevant slice; larger storage does not enlarge prompts.
  chat-history-events: 12
  chat-relationship-memories: 10

# Physical overhead faction/DTR labels are disabled by default. They used
# persistent ArmorStands and could leave stale floating labels after an
# unclean shutdown.
presentation:
  sidebar: true
  faction-dtr-overhead: false
