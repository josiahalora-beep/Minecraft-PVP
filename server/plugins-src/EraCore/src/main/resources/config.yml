  interval-ticks: 2
  gate-auto-close-ticks: 30
  repair-existing-on-start: true

combat-director:
  hot-body-budget: 12
  visible-fight-min-seconds: 10
  visible-fight-max-seconds: 22
  visible-fight-duration-seconds: 110
  visible-fight-chance-percent: 94
  three-way-brawl-chance-percent: 12
  max-hot-per-faction: 5
  observation-radius: 220
  offscreen-resolution-seconds: 5
  offscreen-brawl-chance-percent: 18
  brawl-radius: 520
  hotspot-funnel-percent: 76
  sotw-scrim-min-seconds: 18
  sotw-scrim-max-seconds: 34
  sotw-scrim-duration-seconds: 75
  sotw-scrim-chance-percent: 72

worker-pool:
  # Global HOT-body ceiling across every registered machine. The coordinator
  # subdivides this budget into per-node leases.
  max-bodies: 40
  offline-bodies: 24
  node-default-bodies: 12
  max-per-faction: 5
  reassess-seconds: 8
  sync-seconds: 10
  minimum-lease-seconds: 120
  missing-candidate-grace-cycles: 4
  rotation-score-margin: 18
  fight-ambient-bodies: 2
  # Reserved physical identities: faction leaders/builders/creators first,
  # followed by the most prestigious/respected players.
  anchor-bodies: 20
  prestige-bodies: 10
  creator-bodies:
    - Stimpypvp
    - Marcel
    - PainfulPvP
    - lolitsalex
    - Skimpy

safezones:
  combat-tag-seconds: 60
  overworld-radius: 110
  nether-radius: 75
  end-radius: 95
  auto-build-borders: true
  archer-tag-seconds: 10
  archer-tag-damage-multiplier: 1.20

duels:
