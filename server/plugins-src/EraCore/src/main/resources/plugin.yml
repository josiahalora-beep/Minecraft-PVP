name: EraCore
main: dev.jorel.eracore.EraCore
version: 0.2.0
commands:
  rank:
    usage: /rank set <player> <rank>
  kit:
    usage: /kit <starter [diamond|bard|archer|miner|rogue]|member|basic|silver|gold|platinum>
  kits:
    usage: /kits
  balance:
    aliases: [bal, money]
    usage: /balance [player]
  pay:
    usage: /pay <player> <amount>
  sell:
    usage: /sell <hand|all>
  buy:
    usage: /buy <item> <amount>
  shop:
    usage: /shop
  vote:
    usage: /vote [odds]
  keys:
    usage: /keys
  crates:
    usage: /crates [vote|donor]
  stats:
    usage: /stats [player]
  history:
    usage: /history [player|faction|server]
  duel:
    usage: /duel <player|accept|decline|stats>
  f:
    aliases: [faction, factions]
    usage: /f <create|invite|join|leave|kick|disband|claim|unclaim|map|sethome|home|show|who|list|c>
  simprobe:
    usage: /simprobe
  simmap:
    usage: /simmap [rebuild]
  simstate:
    usage: /simstate prepare
  spawn:
    usage: /spawn
  stuck:
    usage: /stuck
  setspawn:
    usage: /setspawn
  warp:
    usage: /warp <name>
  warps:
    usage: /warps
  setwarp:
    usage: /setwarp <name>
  delwarp:
    usage: /delwarp <name>
  spawnpreset:
    usage: /spawnpreset playman2013
  msg:
    aliases: [tell, whisper, w]
    usage: /msg <player> <message>
  r:
    usage: /r <message>
  simchat:
    usage: /simchat <on|off|status|pulse>
  sotw:
    usage: /sotw <status|reset [confirm|soft]|end>
  simworker:
    usage: /simworker <sync|deposit|stash|crateprep|gearup|kitcycle|status>
  simcombat:
    usage: /simcombat <sync|release|loot|status|director>
  safezone:
    usage: /safezone <info|set [radius]|build>
  teamfight:
    usage: /teamfight <test [3|4|5]|stop|status>
  bard:
    usage: /bard
  archer:
    usage: /archer
  miner:
    usage: /miner
  rogue:
    usage: /rogue
  duelprep:
    usage: /duelprep
  baserate:
    description: Rate the nearest generated faction base for design feedback
    usage: /baserate <1-5> [faction]
  baserebuild:
    description: Force rebuild generated faction bases
    usage: /baserebuild <all|nearest|faction|status>
  mapinfo:
    description: Show HCF map routes, landmarks, resources and protected zones
    usage: /mapinfo <nearest|routes|resources|zones>
  events:
    description: Show active HCF event status
    usage: /events
  koth:
    description: HCF KOTH locations and capture status
    usage: /koth <list|nearest|status|start <id>|stop>
  conquest:
    description: HCF Conquest status and controls
    usage: /conquest <status|start|stop>
  oremountain:
    aliases: [ore]
    description: Travel to the protected regenerating Ore Mountain
    usage: /oremountain
  mapcompose:
    description: Owner production-map schematic compositor controls
    usage: /mapcompose <status|start>
permissions:
  eracore.owner:
    default: op
