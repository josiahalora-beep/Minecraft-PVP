name: EraCore
main: dev.jorel.eracore.EraCore
version: 0.2.0
commands:
  rank:
    usage: /rank set <player> <rank>
  kit:
    usage: /kit <starter [diamond|bard|archer|miner|rogue]|member|vip|elite|legend|titan>
  kits:
    usage: /kits
  balance:
    aliases: [bal, money]
    usage: /balance [player]
  pay:
    usage: /pay <player> <amount>
  sell:
    usage: /sell <hand|all>
  buy:
    usage: /buy <item> <amount>
  shop:
    usage: /shop
  vote:
    usage: /vote [odds]
  keys:
    usage: /keys
  crates:
    usage: /crates [vote|donor]
  f:
    aliases: [faction, factions]
    usage: /f <create|invite|join|leave|kick|disband|claim|unclaim|sethome|home|who|list|c>
  simprobe:
    usage: /simprobe
  simmap:
    usage: /simmap [rebuild]
  simstate:
    usage: /simstate prepare
  spawn:
    usage: /spawn
  setspawn:
    usage: /setspawn
  warp:
    usage: /warp <name>
  warps:
    usage: /warps
  setwarp:
    usage: /setwarp <name>
  delwarp:
    usage: /delwarp <name>
  spawnpreset:
    usage: /spawnpreset playman2013
  msg:
    aliases: [tell, whisper, w]
    usage: /msg <player> <message>
  r:
    usage: /r <message>
  simchat:
    usage: /simchat <on|off|status|pulse>
  sotw:
    usage: /sotw <status|reset|end>
  simworker:
    usage: /simworker <sync|deposit|stash|status>
  simcombat:
    usage: /simcombat <sync|release|status>
  safezone:
    usage: /safezone <info|set [radius]|build>
  teamfight:
    usage: /teamfight <test [3|4|5]|stop|status>
  bard:
    usage: /bard
  archer:
    usage: /archer
  miner:
    usage: /miner
  rogue:
    usage: /rogue
  duelprep:
    usage: /duelprep
permissions:
  eracore.owner:
    default: op
